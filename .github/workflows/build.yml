name: Build Flutter APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Flutter project
        run: |
          mkdir -p /tmp/flutter_app
          flutter create --project-name messenger_clone /tmp/flutter_app

      - name: Add Internet permission
        run: |
          sed -i '/<manifest xmlns:android=/a\    <uses-permission android:name="android.permission.INTERNET"/>' /tmp/flutter_app/android/app/src/main/AndroidManifest.xml

      - name: Copy app files
        run: |
          cp lib/main.dart /tmp/flutter_app/lib/main.dart
          cp pubspec.yaml /tmp/flutter_app/pubspec.yaml

      - name: Get dependencies
        working-directory: /tmp/flutter_app
        run: flutter pub get

      - name: Build APK
        working-directory: /tmp/flutter_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: messenger-apk
          path: /tmp/flutter_app/build/app/outputs/flutter-apk/app-release.apk
